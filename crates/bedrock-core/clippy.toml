# 根目录 clippy.toml 的设置，clippy 只读离 crate 最近的那份，所以抄一遍
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-unwrap-in-tests = true

# 核心不直接碰外部世界：时间、编号、文件、环境变量都经端口或由各端传进来
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "时间经 Clock 端口取" },
    { path = "std::time::Instant::now", reason = "时间经 Clock 端口取" },
    { path = "jiff::Timestamp::now", reason = "时间经 Clock 端口取" },
    { path = "jiff::Zoned::now", reason = "时间经 Clock 端口取" },
    { path = "std::env::var", reason = "配置由各端读好传进来" },
    { path = "std::env::var_os", reason = "配置由各端读好传进来" },
    { path = "std::env::vars", reason = "配置由各端读好传进来" },
    { path = "std::env::args", reason = "配置由各端读好传进来" },
    { path = "std::env::current_dir", reason = "路径由各端传进来" },
    { path = "std::fs::read", reason = "文件经端口读写" },
    { path = "std::fs::read_to_string", reason = "文件经端口读写" },
    { path = "std::fs::write", reason = "文件经端口读写" },
    { path = "std::fs::read_dir", reason = "文件经端口读写" },
    { path = "std::fs::create_dir_all", reason = "文件经端口读写" },
    { path = "std::fs::remove_file", reason = "文件经端口读写" },
    { path = "std::fs::File::open", reason = "文件经端口读写" },
    { path = "std::fs::File::create", reason = "文件经端口读写" },
    { path = "std::fs::OpenOptions::open", reason = "文件经端口读写" },
    { path = "std::process::Command::new", reason = "外部程序经端口调用" },
    { path = "std::thread::spawn", reason = "后台任务由各端起" },
    { path = "std::thread::sleep", reason = "等待由各端决定" },
]
