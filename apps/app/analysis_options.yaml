# 官方的 flutter_lints 零警告，加上分析器的严格模式和几条真会出错的规则。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # flutter_rust_bridge 生成的胶水代码
    - lib/ffi/**
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # 漏写 await
    - unawaited_futures
    # 对 dynamic 调方法，类型错了要到运行时才知道
    - avoid_dynamic_calls
